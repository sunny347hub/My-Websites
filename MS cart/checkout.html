<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MS Shopping</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

        <a href="home.html" class="nav-logo">
            MS Shopping
        </a>

        <div class="nav-links">

            <a href="home.html">Home</a>

            <a href="cart.html">
                Cart
                <span class="cart-count" id="cartCount">0</span>
            </a>

        </div>

    </nav>

    <main class="checkout-container">

        <h1>Checkout</h1>

        <br>

        <form
            class="checkout-form"
            id="checkoutForm"
        >

            <input
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                type="tel"
                placeholder="Mobile Number"
                required
            >

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <textarea
                rows="5"
                placeholder="Delivery Address"
                required
            ></textarea>

            <select required>

                <option value="">
                    Select Payment Method
                </option>

                <option>
                    Cash on Delivery
                </option>

                <option>
                    UPI
                </option>

                <option>
                    Credit / Debit Card
                </option>

            </select>

            <button type="submit" class="order-btn">
                Place Order
            </button>

        </form>

    </main>

    <script src="script.js"></script>

</body>
</html>
