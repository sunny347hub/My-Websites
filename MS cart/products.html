<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse phones, laptops, electronics and fashion at MS Shopping.">
    <title>All Products - MS Shopping</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="home.html" class="nav-logo">MS Shopping</a>
        <div class="search-box">
            <input id="searchInput" type="search" placeholder="Search products" aria-label="Search products">
            <button type="button" onclick="searchProducts()">Search</button>
        </div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products.html" aria-current="page">Products</a>
            <a href="cart.html">Cart <span class="cart-count" id="cartCount">0</span></a>
        </div>
    </nav>

    <nav class="category-bar" aria-label="Product categories">
        <a href="products.html" aria-current="page">All Products</a>
        <a href="mobile.html">Mobiles</a>
        <a href="laptops.html">Laptops</a>
        <a href="electronics.html">Electronics</a>
        <a href="footwear.html">Fashion &amp; Footwear</a>
    </nav>

    <main class="products-container">
        <header class="page-heading">
            <h1>All Products</h1>
            <p>Browse the complete MS Shopping collection.</p>
            <p id="searchStatus" class="search-status" aria-live="polite"></p>
        </header>
        <div class="product-grid" id="productList"></div>
        <p id="noProducts" class="empty-message" hidden>No products matched your search.</p>
    </main>

    <footer class="footer">
        <h2>MS Shopping</h2>
        <p>Learning storefront demo</p>
        <p>© 2026 MS Shopping</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
