<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MS Shopping Platform</title>

    <link rel="icon" href="logo.png" type="image/png">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            height:100vh;

            background-image:
            linear-gradient(rgba(0,0,0,0.60),rgba(0,0,0,0.60)),
            url("shopping-bg.jpg");

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{

            text-align:center;
            color:white;
        }

        .logo{

            width:180px;
            margin-bottom:25px;
        }
        h1{

            font-size:55px;
            margin-bottom:10px;
        }
        h2{

            color:#d0ff00;
            margin-bottom:20px;
            font-weight:normal;
        }

        p{

            font-size:22px;
            margin-bottom:40px;
        }
        .btn{

            display:inline-block;
            text-decoration:none;

            color:white;

            padding:15px 40px;

            margin:10px;

            border-radius:40px;

            font-size:20px;

            transition:.3s;

            font-weight:bold;
        }

        .signup {

            background-color: green;

            color: white;

        }

        .login {

            background-color: blue;

            color: white;

        }
    </style>

</head>

<body>

<div class="container">

    <img src="logo.png" class="logo" alt="MS Shopping Logo">

    <h1>MS Shopping Platform</h1>

    <h2>Everything You Need, All in One Place</h2>

    <p>
        Fast Delivery • Secure Payments • Best Deals Every Day
    </p>

    <a href="login.html" class="btn login">Login</a>

    <a href="signup.html" class="btn signup">Sign Up</a>

</div>

</body>
</html>
