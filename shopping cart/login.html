<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="icon"
          href="logo.png"
          type="image/png">

    <title>MS Shopping - Login</title>

    <style>
        body {
            background-image:
            linear-gradient(
                rgba(0,0,0,0.60),
                rgba(0,0,0,0.60)
            ),
            url("shopping-bg.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }
        .container {
            background-color: white;

            width: 400px;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .logo {

            width: 180px;

            margin-bottom: 20px;

        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 25px;
        }
        input {

            width: 90%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }
        .btn {
            display: inline-block;

            padding: 12px 30px;

            margin: 10px;

            border: none;

            border-radius: 25px;

            text-decoration: none;

            font-size: 16px;

            cursor: pointer;
        }
        .login {

            background-color: blue;

            color: white;

        }
        .signup {

            background-color: green;

            color: white;

        }


    </style>

</head>


<body>
    <center>
    <div class="container">

        <img src="logo.png"
             class="logo"
             alt="MS Shopping Logo"
             width = 180>

        <h1>Welcome Back</h1>
        <p>
            Login to your MS Shopping account
        </p>
        <form>
            <label for="email">
                Email Address
            </label>
            <br><br>
            <input
                type="email"
                id="email"
                name="email"
                minlength="5"
                maxlength="50"
                placeholder="Enter your email" required>
            <br><br>
            <label for="password">
                Password
            </label>
            <br><br>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="20"
                placeholder="Enter your password" required>
            <br><br>
            <a href="home.html" class="btn login">
                Login
            </a>
        </form>
        <br>
        <p>
            Don't have an account?
        </p>
        <a href="signup.html"
           class="btn signup">
            Sign Up
        </a>
        <br><br>
        <a href="index.html">
            Back to Home
        </a>
    </div>
    </center>
    

</body>

</html>
