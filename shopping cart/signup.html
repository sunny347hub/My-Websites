<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="icon"
          href="logo.png"
          type="image/png">

    <title>MS Shopping - Sign Up</title>


    <style>


        body {

            background-image:
            linear-gradient(
                rgba(0,0,0,0.60),
                rgba(0,0,0,0.60)
            ),
            url("shopping-bg.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            background-color: white;

            width: 400px;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3);

        }


        .logo {

            width: 180px;

            margin-bottom: 20px;

        }


        h1 {

            margin-bottom: 10px;

        }


        p {

            margin-bottom: 20px;

        }

        input {

            width: 90%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }
        .btn {

            display: inline-block;

            padding: 12px 30px;

            margin: 10px;

            border: none;

            border-radius: 25px;

            text-decoration: none;

            font-size: 16px;

            cursor: pointer;

        }

        .signup {

            background-color: green;

            color: white;

        }

        .login {

            background-color: blue;

            color: white;

        }


    </style>

</head>

<body>
    <center>
    <div class="container">


        <img src="logo.png"
             class="logo"
             alt="MS Shopping Logo"
             width = 180px>
        <h1>Create Account</h1>


        <p>
            Create your MS Shopping account
        </p>
        <form>
          <label for="name">
                Full Name
            </label>

            <br><br>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="6"
                maxlength="50"
                required>


            <br><br>
            <label for="email">
                Email Address
            </label>

            <br><br>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

            <br><br>
            <label for="password">
                Password
            </label>
            <br><br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required>
            <br><br>
            <label for="confirm-password">
                Confirm Password
            </label>
            <br><br>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                minlength="8"
                maxlength="20"
                placeholder="Confirm your password"
                required>
            <br><br>
            <a href="login.html" class="btn signup">
                Sign Up
            </a>
        </form>
        <br>
        <p>
            Already have an account?
        </p>
        <a href="login.html"
           class="btn login">
            Login
        </a>
        <br><br>
        <a href="index.html">

            Back to Home

        </a>
    </div>
    </center>

</body>

</html>
